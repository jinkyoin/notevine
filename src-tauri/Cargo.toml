[package]
name = "notevine"
version = "0.4.2"
description = "Notevine — 로컬 마크다운 지식관리·기록 앱"
authors = ["jkin"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "notevine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
trash = "5"
rusqlite = { version = "0.41.0", features = ["bundled"] }
zstd = "0.14.3"
blake3 = "1.8.7"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
yaml-rust2 = "0.13.0"
similar = "3.2.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
ureq = { version = "2", features = ["json"] }
encoding_rs = "0.8"
# FR-AI-03: text of Office/한글(hwpx) files sent to AI. Same versions the updater/plist already use.
zip = { version = "9.3", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.42"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Git backup encryption (docs/암호화-형식.md)
aes-siv = "0.7"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
